<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 年度履职综述 - 潘喜乐</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
/* =============================================
   GLOBAL STYLES
   ============================================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #1a365d;
  --primary-light: #2d4a7c;
  --accent: #f6ad55;
  --accent-light: #fbd38d;
  --secondary: #319795;
  --secondary-light: #4fd1c5;
  --bg-dark: #0f172a;
  --bg-medium: #1e293b;
  --bg-light: #334155;
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.8);
  --text-muted: rgba(255, 255, 255, 0.6);
  --success: #48bb78;
  --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --gradient-2: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
  --gradient-3: linear-gradient(135deg, #4fd1c5 0%, #319795 100%);
  --gradient-4: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
}

html { font-size: 24px; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

#root { width: 100%; height: 100%; overflow: hidden; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--bg-light); border-radius: 3px; }
::selection { background: var(--secondary); color: var(--text-primary); }

/* =============================================
   PRESENTATION STYLES
   ============================================= */
.presentation {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background: var(--bg-dark);
  cursor: none;
}

.cursor-glow {
  position: fixed;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(79, 209, 197, 0.15) 0%, rgba(79, 209, 197, 0.05) 40%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  mix-blend-mode: screen;
}

.cursor-dot {
  position: fixed;
  width: 12px;
  height: 12px;
  background: var(--secondary-light);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  box-shadow: 0 0 10px var(--secondary), 0 0 20px var(--secondary), 0 0 30px rgba(79, 209, 197, 0.5);
}

.presentation * { cursor: none; }

.slide-wrapper {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

.progress-indicator {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.1);
  z-index: 200;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--secondary), var(--accent), var(--secondary));
  box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
}

.keyboard-hints {
  position: fixed;
  bottom: 25px;
  left: 30px;
  display: flex;
  gap: 8px;
  z-index: 100;
}

.hint-key {
  width: 28px;
  height: 28px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.slide {
  min-width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 40px;
  position: relative;
  background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-medium) 100%);
  overflow: hidden;
}

/* CYBER GRID */
.cyber-grid {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.grid-lines {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(79, 209, 197, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79, 209, 197, 0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(50px, 50px); }
}

.grid-glow {
  position: absolute;
  top: 50%; left: 50%;
  width: 100%; height: 100%;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(79, 209, 197, 0.05) 0%, transparent 60%);
}

/* SCAN LINE */
.scan-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, transparent, rgba(79, 209, 197, 0.5), transparent);
  animation: scanMove 4s ease-in-out infinite;
  z-index: 1;
}

@keyframes scanMove {
  0%, 100% { top: 0; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* TECH CORNERS */
.tech-corner {
  position: absolute;
  width: 60px;
  height: 60px;
  z-index: 2;
  pointer-events: none;
}

.tech-corner::before, .tech-corner::after {
  content: '';
  position: absolute;
  background: var(--secondary);
  box-shadow: 0 0 10px var(--secondary);
}

.tech-corner.top-left { top: 20px; left: 20px; }
.tech-corner.top-left::before { top: 0; left: 0; width: 30px; height: 2px; }
.tech-corner.top-left::after { top: 0; left: 0; width: 2px; height: 30px; }

.tech-corner.top-right { top: 20px; right: 20px; }
.tech-corner.top-right::before { top: 0; right: 0; width: 30px; height: 2px; }
.tech-corner.top-right::after { top: 0; right: 0; width: 2px; height: 30px; }

.tech-corner.bottom-left { bottom: 20px; left: 20px; }
.tech-corner.bottom-left::before { bottom: 0; left: 0; width: 30px; height: 2px; }
.tech-corner.bottom-left::after { bottom: 0; left: 0; width: 2px; height: 30px; }

.tech-corner.bottom-right { bottom: 20px; right: 20px; }
.tech-corner.bottom-right::before { bottom: 0; right: 0; width: 30px; height: 2px; }
.tech-corner.bottom-right::after { bottom: 0; right: 0; width: 2px; height: 30px; }

/* GLITCH TEXT */
.glitch-text {
  position: relative;
  display: inline-block;
}

.glitch-text::before, .glitch-text::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: transparent;
}

.glitch-text::before {
  left: 2px;
  text-shadow: -2px 0 var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
  animation: glitch-anim-1 2s infinite linear alternate-reverse;
}

.glitch-text::after {
  left: -2px;
  text-shadow: 2px 0 var(--secondary);
  clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
  animation: glitch-anim-2 2s infinite linear alternate-reverse;
}

@keyframes glitch-anim-1 {
  0%, 100% { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); }
  50% { clip-path: polygon(0 10%, 100% 10%, 100% 45%, 0 45%); }
}

@keyframes glitch-anim-2 {
  0%, 100% { clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); }
  50% { clip-path: polygon(0 55%, 100% 55%, 100% 90%, 0 90%); }
}

/* NEON TEXT */
.neon-text {
  color: var(--secondary-light);
  font-weight: 700;
  animation: breathingGlow 2.5s ease-in-out infinite, breathingBorder 2.5s ease-in-out infinite;
  display: inline-block;
  padding: 2px 8px;
  background: rgba(79, 209, 197, 0.1);
  border: 1px solid rgba(79, 209, 197, 0.4);
  border-radius: 4px;
}

@keyframes breathingGlow {
  0%, 100% {
    text-shadow: 0 0 5px rgba(79, 209, 197, 0.5), 0 0 10px rgba(79, 209, 197, 0.3), 0 0 20px rgba(79, 209, 197, 0.2);
  }
  50% {
    text-shadow: 0 0 10px rgba(79, 209, 197, 0.8), 0 0 25px rgba(79, 209, 197, 0.6), 0 0 40px rgba(79, 209, 197, 0.4);
  }
}

@keyframes breathingBorder {
  0%, 100% {
    box-shadow: 0 0 5px rgba(79, 209, 197, 0.3), inset 0 0 5px rgba(79, 209, 197, 0.1);
    border-color: rgba(79, 209, 197, 0.4);
  }
  50% {
    box-shadow: 0 0 15px rgba(79, 209, 197, 0.6), 0 0 30px rgba(79, 209, 197, 0.3), inset 0 0 10px rgba(79, 209, 197, 0.2);
    border-color: rgba(79, 209, 197, 0.8);
  }
}

.cyber-bracket {
  color: var(--secondary);
  font-weight: 300;
  margin: 0 8px;
}

/* PARTICLES */
.particles {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.particle {
  position: absolute;
  width: var(--size);
  height: var(--size);
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.4;
  animation: floatParticle var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
  left: var(--x-start);
  bottom: -20px;
}

@keyframes floatParticle {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-100vh) translateX(calc(var(--x-end) - var(--x-start))); opacity: 0; }
}

/* SLIDE HEADER */
.slide-header {
  text-align: center;
  margin-bottom: 15px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.slide-title {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--secondary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 5px;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.title-icon {
  font-size: 1rem;
  color: var(--secondary);
  animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

.slide-subtitle {
  font-size: 0.9rem;
  color: var(--secondary);
  font-weight: 400;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* COVER SLIDE */
.cover-slide {
  background: radial-gradient(ellipse at center, var(--bg-medium) 0%, var(--bg-dark) 70%);
  justify-content: center;
  padding: 60px;
}

.cover-content {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 900px;
}

.cover-badge {
  display: inline-block;
  padding: 10px 28px;
  background: rgba(79, 209, 197, 0.1);
  border: 1px solid rgba(79, 209, 197, 0.3);
  border-radius: 4px;
  font-size: 0.9rem;
  color: var(--secondary-light);
  letter-spacing: 4px;
  margin-bottom: 25px;
  position: relative;
  overflow: hidden;
}

.badge-glow {
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(79, 209, 197, 0.3), transparent);
  animation: badgeShine 3s ease-in-out infinite;
}

@keyframes badgeShine {
  0% { left: -100%; }
  50%, 100% { left: 100%; }
}

.cover-title {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 30px;
}

.title-gradient {
  font-size: 4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--secondary-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 4px;
}

.title-sub {
  font-size: 2rem;
  font-weight: 300;
  color: var(--text-secondary);
  letter-spacing: 10px;
}

.cover-author { margin-bottom: 30px; }

.author-name {
  font-size: 1.8rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 10px;
}

.author-meta {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex;
  justify-content: center;
  gap: 20px;
}

.meta-item { display: flex; gap: 8px; }
.meta-label { color: var(--secondary); font-weight: 600; }
.meta-divider { color: var(--secondary); opacity: 0.5; }

.cover-intro {
  text-align: left;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(79, 209, 197, 0.2);
  border-radius: 8px;
  padding: 25px 30px;
  margin-bottom: 20px;
  position: relative;
}

.intro-border {
  position: absolute;
  top: -1px; left: 20px; right: 20px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--secondary), transparent);
}

.cover-intro p {
  font-size: 1rem;
  line-height: 1.8;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.cover-intro p:last-child { margin-bottom: 0; }
.cover-intro .highlight-text { color: var(--accent); font-size: 1.1rem; }
.cover-intro strong { color: var(--text-primary); }

/* METRICS */
.metrics-slide { justify-content: center; }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  max-width: 1300px;
  width: 100%;
  position: relative;
  z-index: 10;
}

.metric-card {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
  border: 1px solid rgba(79, 209, 197, 0.2);
  border-radius: 12px;
  padding: 25px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.card-glow {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--secondary), transparent);
}

.metric-icon { font-size: 2rem; margin-bottom: 12px; }

.metric-value {
  font-size: 2.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.metric-label {
  font-size: 1rem;
  color: var(--text-primary);
  font-weight: 600;
  margin-bottom: 10px;
}

.metric-desc {
  font-size: 0.72rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* TECH STACK */
.techstack-slide { justify-content: center; }

.tech-intro {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: 30px;
  text-align: center;
  position: relative;
  z-index: 10;
}

.tech-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
  max-width: 1000px;
  width: 100%;
  position: relative;
  z-index: 10;
}

.tech-category {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
  border: 1px solid rgba(79, 209, 197, 0.2);
  border-radius: 12px;
  padding: 22px;
  transition: all 0.3s ease;
}

.tech-category-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

.tech-icon { font-size: 1.6rem; }

.tech-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-primary);
}

.tech-items { display: flex; flex-wrap: wrap; gap: 8px; }

.tech-badge {
  display: inline-block;
  padding: 6px 14px;
  background: rgba(79, 209, 197, 0.1);
  border: 1px solid rgba(79, 209, 197, 0.3);
  border-radius: 4px;
  font-size: 0.85rem;
  color: var(--secondary-light);
  cursor: pointer;
  transition: all 0.3s ease;
}

.core-skill {
  margin-top: 30px;
  padding: 18px 35px;
  background: linear-gradient(135deg, rgba(246, 173, 85, 0.1) 0%, rgba(237, 137, 54, 0.1) 100%);
  border: 1px solid rgba(246, 173, 85, 0.3);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 1.05rem;
  color: var(--accent-light);
  position: relative;
  z-index: 10;
}

.skill-star {
  font-size: 1.4rem;
  animation: sparkle 2s ease-in-out infinite;
}

@keyframes sparkle {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.3) rotate(15deg); }
}

/* PHILOSOPHY */
.philosophy-slide { justify-content: center; }

.philosophy-timeline {
  display: flex;
  justify-content: center;
  gap: 50px;
  margin-bottom: 35px;
  position: relative;
  z-index: 10;
}

.timeline-line {
  position: absolute;
  top: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--secondary), transparent);
}

.philosophy-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 1;
}

.stage-icon-wrapper { position: relative; }

.stage-icon-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 90px; height: 90px;
  border: 2px solid rgba(79, 209, 197, 0.3);
  border-radius: 50%;
  animation: ringPulse 2s ease-in-out infinite;
}

@keyframes ringPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}

.stage-icon {
  width: 70px; height: 70px;
  background: linear-gradient(145deg, var(--bg-medium) 0%, var(--bg-dark) 100%);
  border: 2px solid var(--secondary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  box-shadow: 0 0 30px rgba(79, 209, 197, 0.3);
  position: relative;
  z-index: 1;
}

.stage-phase {
  font-size: 0.75rem;
  color: var(--secondary);
  font-weight: 700;
  letter-spacing: 2px;
}

.stage-content { text-align: center; }

.stage-title {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.stage-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  display: block;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.stage-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
  max-width: 160px;
}

.philosophy-insights {
  display: flex;
  gap: 25px;
  max-width: 900px;
  width: 100%;
  position: relative;
  z-index: 10;
}

.insight-card {
  flex: 1;
  padding: 20px 25px;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}

.card-border-glow {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--secondary), transparent);
}

.insight-card.awakening {
  background: rgba(79, 209, 197, 0.05);
  border: 1px solid rgba(79, 209, 197, 0.2);
}

.insight-card.logic {
  background: rgba(102, 126, 234, 0.05);
  border: 1px solid rgba(102, 126, 234, 0.2);
  display: flex;
  align-items: flex-start;
  gap: 15px;
}

.insight-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--secondary-light);
  margin-bottom: 12px;
}

.insight-list { list-style: none; padding: 0; margin: 0; }

.insight-list li {
  padding: 6px 0;
  padding-left: 20px;
  position: relative;
  color: var(--text-secondary);
  font-size: 0.95rem;
}

.insight-list li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--secondary);
}

.insight-icon { font-size: 1.8rem; flex-shrink: 0; }

.insight-text {
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--text-secondary);
}

.insight-text strong { color: var(--accent); }

/* PROJECT STATUS */
.project-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.status-badge {
  padding: 8px 20px;
  border-radius: 4px;
  font-size: 0.95rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-pulse {
  width: 8px; height: 8px;
  border-radius: 50%;
  animation: statusPulse 2s ease-in-out infinite;
}

.status-badge.completed {
  background: rgba(72, 187, 120, 0.15);
  border: 1px solid rgba(72, 187, 120, 0.3);
  color: var(--success);
}

.status-badge.completed .status-pulse {
  background: var(--success);
  box-shadow: 0 0 10px var(--success);
}

.status-badge.in-progress {
  background: rgba(246, 173, 85, 0.15);
  border: 1px solid rgba(246, 173, 85, 0.3);
  color: var(--accent);
}

.status-badge.in-progress .status-pulse {
  background: var(--accent);

    const animate = (currentTime) => {
      if (!startTime) startTime = currentTime;
      const progress = Math.min((currentTime - startTime) / duration, 1);
      setCount(Math.floor(progress * end));
      if (progress < 1) requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }, [end, duration]);

  return <span>{prefix}{count.toLocaleString()}{suffix}</span>;
}

// Main App Component
function App() {
  const [[currentSlide, direction], setSlide] = useState([0, 0]);
  const slides = [
    CoverSlide, MetricsSlide, TechStackSlide, PhilosophySlide,
    SuanduoduoSlide, CloudInvestmentSlide, DigitalEmployeeSlide, AILearningSlide,
    OtherProjectsSlide, ReflectionSlide, PlanningSlide, TechTrackingSlide,
    DecisionMethodSlide, ThankYouSlide
  ];
  const totalSlides = slides.length;

  const goToSlide = useCallback((index) => {
    if (index >= 0 && index < totalSlides) {
      setSlide([index, index > currentSlide ? 1 : -1]);
    }
  }, [currentSlide, totalSlides]);

  const nextSlide = useCallback(() => {
    if (currentSlide < totalSlides - 1) setSlide([currentSlide + 1, 1]);
  }, [currentSlide, totalSlides]);

  const prevSlide = useCallback(() => {
    if (currentSlide > 0) setSlide([currentSlide - 1, -1]);
  }, [currentSlide]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        prevSlide();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [nextSlide, prevSlide]);

  const SlideComponent = slides[currentSlide];

  return (
    <div className="presentation">
      <div className="progress-indicator">
        <motion.div className="progress-bar-fill" initial={{ width: 0 }} animate={{ width: `${((currentSlide + 1) / totalSlides) * 100}%` }} transition={{ duration: 0.5 }} />
      </div>

      <AnimatePresence mode="wait">
        <motion.div key={currentSlide} initial={{ opacity: 0, x: direction > 0 ? 100 : -100 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: direction < 0 ? 100 : -100 }} transition={{ duration: 0.3 }} className="slide-wrapper">
          <SlideComponent isActive={true} />
        </motion.div>
      </AnimatePresence>

      <div className="nav-arrows">
        <motion.button className={`nav-arrow prev ${currentSlide === 0 ? 'disabled' : ''}`} onClick={prevSlide} disabled={currentSlide === 0} whileHover={{ scale: 1.1 }} whileTap={{ scale: 0.95 }}>
          <span className="arrow-icon">‹</span>
        </motion.button>
        <motion.button className={`nav-arrow next ${currentSlide === totalSlides - 1 ? 'disabled' : ''}`} onClick={nextSlide} disabled={currentSlide === totalSlides - 1} whileHover={{ scale: 1.1 }} whileTap={{ scale: 0.95 }}>
          <span className="arrow-icon">›</span>
        </motion.button>
      </div>

      <div className="slide-indicators">
        {slides.map((_, index) => (
          <motion.button key={index} className={`indicator ${currentSlide === index ? 'active' : ''}`} onClick={() => goToSlide(index)} whileHover={{ scale: 1.2 }} whileTap={{ scale: 0.9 }} />
        ))}
      </div>

      <div className="slide-counter">
        <span className="current">{String(currentSlide + 1).padStart(2, '0')}</span>
        <span className="separator">/</span>
        <span className="total">{String(totalSlides).padStart(2, '0')}</span>
      </div>

      <div className="keyboard-hints">
        <span className="hint-key">←</span>
        <span className="hint-key">→</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
